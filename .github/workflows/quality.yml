name: npm release
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quality:
    runs-on: macos-26
    timeout-minutes: 20
    outputs:
      release_mode: ${{ steps.release.outputs.mode }}
      release_version: ${{ steps.release.outputs.version }}
      release_archive: ${{ steps.release.outputs.archive }}
      release_integrity: ${{ steps.release.outputs.integrity }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 10.10.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install chromium firefox webkit
      - run: pnpm verify
      - name: Check npm version and tested archive
        id: release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && github.repository == 'squircle-icons/svelte'
        run: node tools/release-status.mjs
      - name: Require approved release artwork
        if: steps.release.outputs.mode == 'publish' || steps.release.outputs.mode == 'tags'
        run: pnpm release:check
      - uses: actions/upload-artifact@v7.0.2
        if: steps.release.outputs.mode == 'publish' || steps.release.outputs.mode == 'tags'
        with:
          name: npm-package-${{ github.sha }}
          path: ${{ steps.release.outputs.archive }}
          if-no-files-found: error
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: validation-reports
          path: |
            playwright-report/
            test-results/
            .artifacts/bundle-report.json
            .artifacts/previews/
  compatibility:
    runs-on: macos-26
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - svelte: '5.0.0'
            node: '18.0.0'
          - svelte: '5.57.2'
            node: '22.23.4'
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - name: Remember consumer Node executable
        run: echo "COMPAT_NODE=$(node -p 'process.execPath')" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 10.10.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install chromium
      - run: pnpm test:compat
        env:
          SVELTE_COMPAT_VERSION: ${{ matrix.svelte }}
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: compatibility-${{ matrix.svelte }}-node-${{ matrix.node }}
          path: .artifacts/compatibility-*.json
  publish:
    name: Publish verified npm package
    needs: [quality, compatibility]
    if: needs.quality.outputs.release_mode == 'publish' || needs.quality.outputs.release_mode == 'tags'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: npm
    concurrency:
      group: npm-release
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_VERSION: ${{ needs.quality.outputs.release_version }}
      RELEASE_ARCHIVE: ${{ needs.quality.outputs.release_archive }}
      RELEASE_INTEGRITY: ${{ needs.quality.outputs.release_integrity }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Install OIDC-capable npm with distribution-tag support
        run: npm install --global npm@12.2.1 --ignore-scripts --no-audit --no-fund
      - uses: actions/download-artifact@v8.0.2
        with:
          name: npm-package-${{ github.sha }}
          path: .artifacts
      - name: Require the current main revision
        id: current
        run: |
          release_head=$(git ls-remote origin refs/heads/main | cut -f1)
          test -n "$release_head"
          if [ "$release_head" = "$GITHUB_SHA" ]; then
            echo 'allowed=true' >> "$GITHUB_OUTPUT"
          else
            echo 'A newer main revision exists; its successful checks own the next release.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Recheck registry and archive integrity
        id: release
        if: steps.current.outputs.allowed == 'true'
        run: |
          node tools/release-status.mjs
          node --input-type=module - <<'JS'
          import assert from 'node:assert/strict';
          import { createHash } from 'node:crypto';
          import { readFile } from 'node:fs/promises';
          const integrity = 'sha512-' + createHash('sha512').update(await readFile(process.env.RELEASE_ARCHIVE)).digest('base64');
          assert.equal(integrity, process.env.RELEASE_INTEGRITY, 'Downloaded archive differs from the tested artifact');
          JS
      - name: Publish the tested archive with npm Trusted Publishing
        if: steps.current.outputs.allowed == 'true' && steps.release.outputs.mode == 'publish'
        run: npm publish "./$RELEASE_ARCHIVE" --ignore-scripts --access public --tag alpha --provenance
      - name: Reject conflicting published contents
        if: steps.current.outputs.allowed == 'true' && steps.release.outputs.mode == 'skip'
        run: |
          echo 'This version was published with different contents. Choose a new version.' >&2
          exit 1
      - name: Wait for npm processing and verify the published archive
        if: steps.current.outputs.allowed == 'true'
        run: node tools/release-status.mjs --wait
      - name: Align alpha and latest through OIDC
        if: steps.current.outputs.allowed == 'true'
        run: |
          npm dist-tag add "@squircle-icons/svelte@$RELEASE_VERSION" alpha
          npm dist-tag add "@squircle-icons/svelte@$RELEASE_VERSION" latest
          node --input-type=module - <<'JS'
          import assert from 'node:assert/strict';
          const response = await fetch('https://registry.npmjs.org/-/package/@squircle-icons%2fsvelte/dist-tags', { cache: 'no-store', signal: AbortSignal.timeout(15000) });
          assert(response.ok, `npm tags returned HTTP ${response.status}`);
          const tags = await response.json();
          assert.equal(tags.alpha, process.env.RELEASE_VERSION);
          assert.equal(tags.latest, process.env.RELEASE_VERSION);
          console.log(tags);
          JS
          echo "Published @squircle-icons/svelte@$RELEASE_VERSION after all quality and compatibility checks passed." >> "$GITHUB_STEP_SUMMARY"
